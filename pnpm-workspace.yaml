allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  nx: true
  protobufjs: false
  sharp: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@battis/*'
  - '@groton/*'
publicHoistPattern:
  - '*prettier*'
  - '*eslint*'
  - '@commitlint/*'
  - commit-and-tag-version
  - lerna
  - monorepo-package-paths
  - npm-run-all
packages:
  - packages/*
catalogs:
  prod:
    '@battis/lazy-secrets': ^1.1.2
    '@groton/veracross-api': ^0.0.13
    next: ^16.4.2
    openid-client: ^6.8.8
    react: ^19.3.1
    react-dom: 19.2.8
    temporal-polyfill: ^1.0.6
  dev:
    '@battis/workspace': ^0.0.12
    '@tsconfig/node-lts': ^24.0.1
    '@types/node': ^24.19.2
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    del-cli: ^8.0.1
    npm-run-all: ^4.1.5
    typescript: ^7.0.2
